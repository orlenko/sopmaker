name: Check and build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - run: uv sync --locked --python 3.13
      - run: uv run ruff check .
      - run: uv run pytest
      - run: uv run playwright install --with-deps chromium
      - run: uv run python scripts/browser_smoke.py
      - run: uv run python scripts/browser_regressions.py
      - run: uv run python scripts/browser_quickstart.py
      - name: Exercise isolated Windows credential storage
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Remove-Item Env:PYTHON_KEYRING_BACKEND -ErrorAction SilentlyContinue
          uv run python scripts/windows_credentials_smoke.py --allow-credential-store
  windows-package:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked --python 3.13
      - run: uv run python packaging/build.py
      - run: uv run python scripts/packaged_smoke.py dist/Sopmaker/Sopmaker.exe
      - name: Zip portable application
        shell: pwsh
        run: Compress-Archive -Path dist/Sopmaker -DestinationPath dist/Sopmaker-windows-x64.zip
      - name: Prepare Windows setup package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist/Windows-Setup | Out-Null
          Copy-Item -Path packaging/windows/* -Destination dist/Windows-Setup
          Copy-Item -Path dist/Sopmaker -Destination dist/Windows-Setup -Recurse
          Compress-Archive -Path dist/Windows-Setup/* -DestinationPath dist/Sopmaker-Windows-Setup.zip
          Expand-Archive -Path dist/Sopmaker-Windows-Setup.zip -DestinationPath dist/Extracted-Setup
      - name: Test setup and update with Windows PowerShell 5.1
        shell: powershell
        run: ./scripts/windows_install_smoke.ps1 -SetupDir dist/Extracted-Setup
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Sopmaker-windows-x64
          path: dist/Sopmaker-windows-x64.zip
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Sopmaker-Windows-Setup
          path: dist/Sopmaker-Windows-Setup.zip
          retention-days: 7
