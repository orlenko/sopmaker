[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sopmaker"
version = "0.1.1"
description = "A local inspection notebook with source-linked AI draft notes"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "av>=16",
  "filelock>=3.20",
  "keyring>=25.6",
  "openai>=2.8",
  "pillow>=12",
  "pydantic>=2.12",
  "python-docx>=1.2",
  "tzdata>=2025.2",
]

[project.scripts]
sopmaker = "sopmaker.app:main"

[dependency-groups]
dev = ["pytest>=9", "ruff>=0.14", "pyinstaller>=6.17", "playwright>=1.56"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sopmaker = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
